name: SEC Form 4 AI Agent Monitor

on:
  schedule:
    # Esegue lo script ogni 15 minuti
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla dashboard GitHub

jobs:
  run-sec-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice dal repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa le dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Esegui l'Agente SEC
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
      run: |
        python sec_agent.py